name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: dist/checksums.txt
      - name: Resolve Docker image digest
        id: image
        run: |
          digest=$(jq -r '.[] | select(.type == "Docker Manifest" or .type == "Published Docker Image") | .extra.Digest // .extra.digest' dist/artifacts.json | head -n1)
          name=$(jq -r '.[] | select(.type == "Docker Manifest" or .type == "Published Docker Image") | .name' dist/artifacts.json | head -n1 | cut -d: -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Attest Docker image provenance
        if: steps.image.outputs.digest != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
