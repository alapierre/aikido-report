name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly, Monday morning (off the full hour on purpose).
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        # Code scanning upload requires the feature to be enabled in repo
        # settings (Settings → Security → Code scanning). It is free for
        # public repos but requires GitHub Advanced Security for private ones.
        # continue-on-error keeps the pipeline green while the repo is private
        # or before the feature is activated.
        continue-on-error: true
        with:
          sarif_file: govulncheck.sarif

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
